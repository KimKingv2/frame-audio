<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15131d"><title>FRAME Audio｜播放診斷</title>
<style>
:root{color-scheme:dark;background:#15131d;color:#eee9f6;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px 16px 70px}.wrap{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.brand{letter-spacing:.12em;font-size:12px;color:#bda0e8}.brand b{color:#f1eaff}.back{color:#c7b3e4;text-decoration:none;font-size:12px}.card{border:1px solid #cbb2ee25;border-radius:13px;background:#211e2b;padding:20px;margin:14px 0}.card h1{font-size:23px;margin:0 0 8px}.sub{color:#9c93aa;font-size:12px}.grid{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#b9afc8}.field input{width:100%;border:1px solid #c7b3df30;border-radius:8px;padding:11px;background:#171520;color:#f3eff9;font:12px inherit}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:1px solid #b99ae866;border-radius:8px;padding:10px 14px;color:#eee5ff;background:#8c68b52c;cursor:pointer}button.secondary{border-color:#c7b3df33;background:#fff1;color:#c9c1d4}button:disabled{opacity:.5;cursor:wait}.status{white-space:pre-wrap;overflow-wrap:anywhere;background:#14121b;border-radius:9px;padding:12px;color:#b9afc8;font:11px/1.8 ui-monospace,Menlo,monospace;min-height:90px}.log{max-height:420px;overflow:auto}.audio{width:100%;margin-top:12px}.note{font-size:11px;color:#8f879b}.ok{color:#9fd1ac}.warn{color:#e0bd88}.err{color:#eea5a5}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">FRAME <b>Audio</b> / DIAGNOSTICS</div><a class="back" href="/">← 返回播放器</a></div>
<section class="card"><h1>VPS Alist 播放鏈路診斷</h1><div class="sub">只讀檢查 VPS Alist /api/fs/get、音訊來源 Range 與 HTML5 Audio。Range 測試最多讀取 64 KiB，不會下載整首或修改原始檔案。</div></section>
<section class="card"><div class="grid">
<div class="field"><label for="base">VPS Alist 網址</label><input id="base" value="https://drive.kimkingv2.top"></div>
<div class="field"><label for="token">VPS Alist API Token（只保留在本頁記憶體）</label><input id="token" type="password" autocomplete="off" placeholder="貼上 Token"></div>
<div class="field"><label for="path">完整音訊路徑</label><input id="path" placeholder="/中國移動雲盤/Kim King/03 Music/歌曲.mp3"></div>
</div><div class="actions"><button id="probe">檢查 API + Range（最多 64 KiB）</button><button id="play" class="secondary">直接測試 HTML5 播放</button><button id="stop" class="secondary">停止播放</button></div><p class="note">播放測試會使用 VPS Alist 回傳的 raw_url。若格式不支援，日誌會列出 MediaError code。</p><audio id="audio" class="audio" controls preload="metadata"></audio></section>
<section class="card"><h2 style="font-size:15px;margin-top:0">診斷結果</h2><div id="summary" class="status">尚未開始。先填 Token 與音訊路徑。</div></section>
<section class="card"><h2 style="font-size:15px;margin-top:0">事件日誌</h2><div id="log" class="status log">等待操作…</div></section>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),audio=$("audio"),log=$("log"),summary=$("summary");
let rawUrl="",fileInfo=null,timeoutTimer=null;
function say(s,cls=""){const d=document.createElement("div");d.textContent=new Date().toLocaleTimeString()+"  "+s;if(cls)d.className=cls;log.append(d);log.scrollTop=log.scrollHeight}
function result(s,cls=""){summary.textContent=s;summary.className="status "+cls}
function input(){const base=$("base").value.trim().replace(/\/+$/,""),token=$("token").value.trim(),path=$("path").value.trim();if(!/^https?:\/\//i.test(base))throw Error("VPS Alist 網址不正確");if(!path.startsWith("/"))throw Error("路徑必須以 / 開頭");return {base,token,path}}
async function getInfo(){const x=input(),h={"Content-Type":"application/json"};if(x.token)h.Authorization=x.token;say("POST /api/fs/get 開始");const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);let r;try{r=await fetch(x.base+"/api/fs/get",{method:"POST",mode:"cors",credentials:"omit",redirect:"error",headers:h,body:JSON.stringify({path:x.path,password:""}),signal:c.signal})}finally{clearTimeout(t)}say("/api/fs/get HTTP "+r.status);const p=await r.json();if(!r.ok||Number(p.code)!==200)throw Error("VPS Alist API "+(p.code||r.status)+": "+(p.message||r.statusText));if(!p.data||!p.data.raw_url)throw Error("回應缺少 data.raw_url");fileInfo=p.data;rawUrl=new URL(p.data.raw_url,x.base+"/").href;say("檔案資訊取得成功；size="+p.data.size+"；raw_url host="+new URL(rawUrl).host,"ok");return {x,p}
}
$("probe").onclick=async()=>{ $("probe").disabled=true;log.textContent="";try{result("檢查中…");const {x}=await getInfo();const size=Number(fileInfo.size||0);if(!size)throw Error("檔案大小為 0");const end=Math.min(65535,size-1);say("GET raw_url Range bytes=0-"+end+"（最多 64 KiB）");const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);let r;try{r=await fetch(rawUrl,{method:"GET",mode:"cors",credentials:"omit",redirect:"follow",headers:{Range:"bytes=0-"+end},signal:c.signal})}finally{clearTimeout(t)}const cr=r.headers.get("content-range")||"(未暴露)",ct=r.headers.get("content-type")||"(未暴露)",cl=r.headers.get("content-length")||"(未暴露)";say("音訊來源 HTTP "+r.status+"；Content-Type="+ct+"；Content-Length="+cl+"；Content-Range="+cr+"；最終 host="+new URL(r.url||rawUrl).host);let bytes=0;if(r.body&&r.status===206){const rd=r.body.getReader();try{while(bytes<65536){const z=await rd.read();if(z.done)break;bytes+=z.value.byteLength}}finally{await rd.cancel().catch(()=>{})}}else if(r.body)await r.body.cancel().catch(()=>{});say("實際讀取 "+bytes+" bytes（已停止串流）",bytes?"ok":"warn");result("API：成功\nHTTP： "+r.status+"\nContent-Type："+ct+"\nContent-Range："+cr+"\n讀取："+bytes+" bytes\n檔案大小："+size+" bytes\n來源主機："+new URL(r.url||rawUrl).host,bytes?"ok":"warn");}catch(e){say("FAIL："+(e.name==="AbortError"?"請求逾時":e.message),"err");result("FAIL："+(e.name==="AbortError"?"請求逾時":e.message),"err")}finally{$("probe").disabled=false}};
$("play").onclick=async()=>{try{await getInfo();audio.pause();audio.removeAttribute("src");audio.load();audio.src=rawUrl;audio.load();say("raw_url 已交給 HTML5 Audio；等待 metadata/canplay/error");result("播放測試中…")}catch(e){say("FAIL："+e.message,"err");result("FAIL："+e.message,"err")}};
$("stop").onclick=()=>{audio.pause();audio.removeAttribute("src");audio.load();say("已停止播放並清除 src")};
audio.addEventListener("loadstart",()=>say("Audio loadstart"));audio.addEventListener("loadedmetadata",()=>say("Audio loadedmetadata：duration="+audio.duration,"ok"));audio.addEventListener("canplay",()=>say("Audio canplay：可開始播放","ok"));audio.addEventListener("playing",()=>say("Audio playing","ok"));audio.addEventListener("stalled",()=>say("Audio stalled：資料供應停滯","warn"));audio.addEventListener("waiting",()=>say("Audio waiting：等待更多資料","warn"));audio.addEventListener("ended",()=>say("Audio ended"));audio.addEventListener("error",()=>{const e=audio.error;const names={1:"MEDIA_ERR_ABORTED",2:"MEDIA_ERR_NETWORK",3:"MEDIA_ERR_DECODE",4:"MEDIA_ERR_SRC_NOT_SUPPORTED"};const msg="Audio error code="+(e?.code||"未知")+" "+(names[e?.code]||"")+"；message="+(e?.message||"瀏覽器未提供");say(msg,"err");result(msg,"err")});
})();
</script></body></html>
