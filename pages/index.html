<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171421">
  <meta name="description" content="FRAME Music：私人音樂庫播放器。">
  <title>FRAME Music</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #111019;
      color: #f2effa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(121, 82, 181, .22), transparent 38%),
        radial-gradient(ellipse at 85% 88%, rgba(76, 64, 128, .16), transparent 36%),
        #111019;
    }
    main {
      width: min(100%, 760px);
      padding: clamp(28px, 6vw, 58px);
      border: 1px solid rgba(196, 174, 235, .16);
      border-radius: 28px;
      background: rgba(28, 25, 39, .88);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .34);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #c7b5ec;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #aa8be8;
      box-shadow: 0 0 16px #aa8be8;
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(42px, 9vw, 76px);
      line-height: .98;
      letter-spacing: -.055em;
    }
    .subtitle {
      margin: 0;
      color: #b8b1c8;
      font-size: clamp(15px, 2.5vw, 18px);
      line-height: 1.7;
    }
    .rule { height: 1px; margin: 34px 0 26px; background: rgba(196, 174, 235, .14); }
    .status {
      display: flex; align-items: center; gap: 10px;
      color: #e5dcf6; font-size: 14px; font-weight: 600;
    }
    .status-mark {
      display: grid; place-items: center; width: 28px; height: 28px;
      border-radius: 9px; background: rgba(154, 119, 211, .17); color: #c9b2f3;
    }
    .note { margin: 12px 0 0 38px; color: #928aa3; font-size: 13px; line-height: 1.7; }
    footer { margin-top: 42px; color: #716a80; font-size: 11px; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span> PRIVATE MUSIC LIBRARY</div>
    <h1>FRAME<br>Music</h1>
    <p class="subtitle">你的音樂，井然有序。<br>以 OpenList 為音樂來源的私人音樂播放器。</p>
    <div class="rule"></div>
    <div class="status">
      <span class="status-mark" aria-hidden="true">♪</span>
      專案入口已建立
    </div>
    <p class="note">目前是初始部署測試頁。下一步將接入音樂索引、資料夾歌單、專輯封面、歌詞與串流播放。</p>
    <footer>FRAME MUSIC · V1.0 FOUNDATION</footer>
  </main>
</body>
</html>
