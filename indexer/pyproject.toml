[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-audio-indexer"
version = "0.1.0"
description = "Private OpenList audio library tools for FRAME Audio"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mutagen>=1.47,<2",
  "Pillow>=10,<13"
]

[project.scripts]
frame-audio-indexer = "frame_audio_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
